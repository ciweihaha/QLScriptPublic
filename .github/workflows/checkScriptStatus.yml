name: Update README Table

on:
  push:
    branches:
      - main
    paths:
      - 'daily/**'          # 监控 daily 目录
      - '!daily/notify.py'  # 排除 notify.py
      - '!daily/**/*.md'    # 排除 md 文件
      - 'wxapp/**'          # 监控 wxapp 目录
      - '!wxapp/**/*.md'    # 排除 wxapp 下的 md 文件

jobs:
  update-readme:
    runs-on: ubuntu-latest
    # 最小权限说明：contents:write 仅用于末尾 git push 回写 README.md（脚本内只 git add README.md）；其余步骤只读。
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: 运行更新脚本
        env:
          TZ: Asia/Shanghai
          DIFF_BEFORE: ${{ github.event.before }}
          DIFF_SHA: ${{ github.sha }}
        run: |
          cat << 'EOF' > update_readme.py
          import os
          import re
          import datetime
          import subprocess

          # 获取本次 Push 更改的文件列表（push 事件自带 before/sha，覆盖整次推送；
          # 合并提交推送时 before 为合并前 main、sha 为合并提交，diff 即整 PR 变更，行为不变）
          before = os.environ.get('DIFF_BEFORE', '').strip()
          sha = os.environ.get('DIFF_SHA', '').strip()
          zero_sha = '0' * 40
          scan_only_fallback = False
          if not before or not sha or before == zero_sha or sha == zero_sha:
              # 强制推送 / 新建分支：before 全零，无法做范围 diff；
              # 回退为扫描全部脚本并只补缺失行，不改已有行时间。
              print("注意：推送前置 SHA 为空或全零（强制推送/新建分支），回退为扫描全部脚本并只补缺失行")
              scan_only_fallback = True
              changed_files = []
          else:
              try:
                  diff_cmd = ['git', 'diff', '--name-only', f'{before}..{sha}']
                  result = subprocess.run(diff_cmd, capture_output=True, text=True, check=True)
                  changed_files = result.stdout.splitlines()
              except Exception as e:
                  # 失败回退改为显式失败，不要静默产出空变更集。
                  print(f"错误：获取推送变更集失败（{before}..{sha}）: {e}")
                  exit(1)

          now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')

          def file_commit_time(fpath):
              # 该文件的 git 最后提交时间（git log -1 --format=%ci）；无 git 历史时（如浅克隆）回退为 now 并加注日志。
              try:
                  result = subprocess.run(['git', 'log', '-1', '--format=%ci', '--', fpath], capture_output=True, text=True, check=True)
                  out = result.stdout.strip()
                  if out:
                      return out[:19]
              except Exception:
                  pass
              print(f"注意：{fpath} 无 git 历史，更新时间回退为当前时间")
              return now

          def extract_env_names(content):
              # 每文件全部 Env("...") 名称；跳过行首注释（# / // 开头行）以降低误报。
              names = []
              for line in content.splitlines():
                  stripped = line.strip()
                  if stripped.startswith('#') or stripped.startswith('//'):
                      continue
                  for match in re.finditer(r'Env\s*\(\s*["\']([^"\']+)["\']\s*\)', line):
                      names.append(match.group(1))
              return names

          def normalize_header(header_lines):
              # 表头注明时间口径：文件最后提交时间；无历史时为补缺运行时间。已有则不重复。
              normalized = []
              for line in header_lines:
                  if '脚本名称' in line and '文件最后提交时间' not in line:
                      line = line.replace('最后一次更新时间', '最后一次更新时间（文件最后提交时间；无历史时为补缺运行时间）')
                  normalized.append(line)
              return normalized

          # ========== 1. 收集更新信息 ==========
          daily_updates = {}   # 脚本名 -> 更新时间
          wxapp_updates = {}   # 脚本名 -> 更新时间

          for f in changed_files:
              # 处理 daily 目录
              if f.startswith('daily/') and os.path.exists(f):
                  filename = os.path.basename(f)
                  if filename != 'notify.py' and not f.endswith('.md'):
                      try:
                          with open(f, 'r', encoding='utf-8') as file:
                              content = file.read()
                      except Exception as e:
                          print(f"警告：无法读取 {f}，跳过: {e}")
                          continue
                      for env_name in extract_env_names(content):
                          daily_updates[env_name] = file_commit_time(f)

              # 处理 wxapp 目录（同样使用 Env 提取）
              elif f.startswith('wxapp/') and os.path.exists(f):
                  if f.endswith('.js') or f.endswith('.py'):
                      try:
                          with open(f, 'r', encoding='utf-8') as file:
                              content = file.read()
                      except Exception as e:
                          print(f"警告：无法读取 {f}，跳过: {e}")
                          continue
                      for env_name in extract_env_names(content):
                          wxapp_updates[env_name] = file_commit_time(f)

          # ========== 2. 扫描目录获取所有现有脚本 ==========
          # daily 所有 Env 名称（名称 -> 该文件的最后提交时间，用于补缺行）
          all_daily_scripts = {}
          if os.path.exists('daily'):
              for root, _, files in os.walk('daily'):
                  for file in files:
                      if file != 'notify.py' and not file.endswith('.md'):
                          fpath = os.path.join(root, file).replace('\\\\', '/')
                          try:
                              with open(fpath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                          except Exception:
                              continue
                          for env_name in extract_env_names(content):
                              all_daily_scripts.setdefault(env_name, file_commit_time(fpath))

          # wxapp 所有 Env 名称
          all_wxapp_scripts = {}
          if os.path.exists('wxapp'):
              for root, _, files in os.walk('wxapp'):
                  for file in files:
                      if file.endswith('.js') or file.endswith('.py'):
                          fpath = os.path.join(root, file).replace('\\\\', '/')
                          try:
                              with open(fpath, 'r', encoding='utf-8') as f:
                                  content = f.read()
                          except Exception:
                              continue
                          for env_name in extract_env_names(content):
                              all_wxapp_scripts.setdefault(env_name, file_commit_time(fpath))

          # ========== 3. 更新 README 中的两个表格 ==========
          readme_path = 'README.md'
          if not os.path.exists(readme_path):
              print("README.md 不存在！")
              exit(1)

          with open(readme_path, 'r', encoding='utf-8') as f:
              full_text = f.read()

          # ---------- 3.1 更新 daily 表格 ----------
          start_daily = "<!-- README_TABLE_START -->"
          end_daily   = "<!-- README_TABLE_END -->"

          if start_daily not in full_text or end_daily not in full_text:
              print("错误：未找到 daily 表格的锚点标记！")
              exit(1)

          pre_part, temp = full_text.split(start_daily)
          daily_table_section, post_part = temp.split(end_daily)

          lines = daily_table_section.strip().split('\n')
          header, separator, body_lines = [], [], []
          mode = 'header'
          for line in lines:
              l_s = line.strip()
              if not l_s.startswith('|'):
                  continue
              if '脚本名称' in l_s:
                  header.append(line)
                  mode = 'separator'
              elif '---' in l_s and mode == 'separator':
                  separator.append(line)
                  mode = 'body'
              elif mode == 'body':
                  body_lines.append(line)

          existing_daily = set()
          new_daily_body = []
          for line in body_lines:
              parts = [p.strip() for p in line.split('|')]
              if len(parts) >= 4:
                  name = parts[1]
                  existing_daily.add(name)
                  if name in daily_updates:
                      line = f"| {name} | {daily_updates[name]} | ✅ |"
                  elif not scan_only_fallback and name not in all_daily_scripts:
                      # 表中已不存在于目录：只加“已移除”标记，不直接删除，避免误删重命名场景。
                      line = f"| {name} | {parts[2]} | 已移除 |"
              new_daily_body.append(line)

          for name, tm in daily_updates.items():
              if name not in existing_daily:
                  new_daily_body.append(f"| {name} | {tm} | ✅ |")
                  existing_daily.add(name)

          for name, tm in all_daily_scripts.items():
              if name not in existing_daily:
                  new_daily_body.append(f"| {name} | {tm} | ✅ |")

          header = normalize_header(header)
          final_daily_table = "\n".join(header + separator + new_daily_body)

          # ---------- 3.2 更新 wxapp 表格 ----------
          start_wxapp = "<!-- WXAPP_TABLE_START -->"
          end_wxapp   = "<!-- WXAPP_TABLE_END -->"

          if start_wxapp not in full_text or end_wxapp not in full_text:
              print("错误：未找到 wxapp 表格的锚点标记！")
              exit(1)

          # 从 post_part 中提取 wxapp 表格（因为 daily 表格已被切出）
          wxapp_pre, wxapp_temp = post_part.split(start_wxapp)
          wxapp_table_section, final_post = wxapp_temp.split(end_wxapp)

          lines_wx = wxapp_table_section.strip().split('\n')
          header_wx, separator_wx, body_lines_wx = [], [], []
          mode_wx = 'header'
          for line in lines_wx:
              l_s = line.strip()
              if not l_s.startswith('|'):
                  continue
              if '脚本名称' in l_s:
                  header_wx.append(line)
                  mode_wx = 'separator'
              elif '---' in l_s and mode_wx == 'separator':
                  separator_wx.append(line)
                  mode_wx = 'body'
              elif mode_wx == 'body':
                  body_lines_wx.append(line)

          existing_wxapp = set()
          new_wxapp_body = []
          for line in body_lines_wx:
              parts = [p.strip() for p in line.split('|')]
              if len(parts) >= 4:
                  name = parts[1]
                  existing_wxapp.add(name)
                  if name in wxapp_updates:
                      line = f"| {name} | {wxapp_updates[name]} | ✅ |"
                  elif not scan_only_fallback and name not in all_wxapp_scripts:
                      # 表中已不存在于目录：只加“已移除”标记，不直接删除，避免误删重命名场景。
                      line = f"| {name} | {parts[2]} | 已移除 |"
              new_wxapp_body.append(line)

          for name, tm in wxapp_updates.items():
              if name not in existing_wxapp:
                  new_wxapp_body.append(f"| {name} | {tm} | ✅ |")
                  existing_wxapp.add(name)

          for name, tm in all_wxapp_scripts.items():
              if name not in existing_wxapp:
                  new_wxapp_body.append(f"| {name} | {tm} | ✅ |")

          header_wx = normalize_header(header_wx)
          final_wxapp_table = "\n".join(header_wx + separator_wx + new_wxapp_body)

          # 重新组合整个 README
          final_content = (
              pre_part + start_daily + "\n" + final_daily_table + "\n" + end_daily +
              wxapp_pre + start_wxapp + "\n" + final_wxapp_table + "\n" + end_wxapp +
              final_post
          )

          with open(readme_path, 'w', encoding='utf-8') as f:
              f.write(final_content)
          print("README.md 处理完成。")
          EOF

          python update_readme.py

      - name: 提交并推送变更
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: 自动更新 daily 和 wxapp 脚本状态 [skip ci]"
            git push
          else
            echo "无变更需推送。"
          fi
